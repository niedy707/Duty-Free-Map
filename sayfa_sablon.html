const SIMGE = { EUR: "€", JPY: "¥", GBP: "£" };
function para(n, p) {
  if (n == null) return "—";
  const k = p === "EUR" || p === "GBP" ? 2 : 0, s = n.toLocaleString(YEREL[L], { minimumFractionDigits: k, maximumFractionDigits: k });
  return SIMGE[p] ? SIMGE[p] + s : s + " " + p;
}
const tam = n => Math.round(n).toLocaleString(YEREL[L]);
const tarih = s => new Date(s + "T00:00:00").toLocaleDateString(YEREL[L], { day: "numeric", month: "short", year: "numeric" });
const hacim = ml => ml ? (ml >= 1000 ? (ml / 1000).toLocaleString(YEREL[L]) + " L" : ml / 10 + " cl") : t("sizeUnknown");
const parantezsiz = s => s.replace(/\s*\([^)]*\)/g, "").trim();
const anahtar = g => (g.marka + " " + parantezsiz(g.urun)).trim().toLowerCase();
const pAnahtar = p => (p.marka + " " + p.urun_anahtar).toLowerCase();
const urunAdi = g => (g.marka + " " + parantezsiz(L === "tr" ? g.urun : g.urun_en)).trim();
const ekAciklama = g => (L === "tr" ? g.urun : g.urun_en).match(/\(([^)]*)\)/)?.[1] || "";
const yerAdi = y => L === "tr" ? y.ad : y.ad_en;
const kod = k => `<span class="kod${YER[k].tur === "duty-free" ? "" : " sehir"}" title="${esc(yerAdi(YER[k]))}">${esc(k.replace("TYO-", ""))}</span>`;
const yeniden = (a, b) => b.tarih.localeCompare(a.tarih);

// Bir gözlem satırı: avro her zaman; yerel para, TL karşılığı ve diğer ayrıntılar alt satırda
function satir(g, vurgu) {
  const ek = [g.para !== "EUR" && g.fiyat != null ? para(g.fiyat, g.para) : "", g.fiyat_try != null ? t("tryApprox", { x: tam(g.fiyat_try) }) : "",
    g.eur_litre != null && g.hacim_ml !== 1000 ? t("perLitre", { x: para(g.eur_litre, "EUR") }) : "", g.liste_fiyat ? t("list", { x: para(g.liste_fiyat, g.para) }) : "",
    g.fiyat_ab_ici ? t("euDest", { x: para(g.fiyat_ab_ici, g.para) }) : "", L === "tr" ? g.teklif : g.teklif_en, g.kaynak && g.kaynak.includes("fiş") ? t("receipt") : "", ekAciklama(g)]
    .filter(Boolean).map(esc);
  if (g.guven === "kısmi") ek.push(`<span class="kismi">${esc(t("partial"))}</span>`);
  return `<div class="satir${vurgu ? " enucuz" : ""}">${kod(g.yer_kod)}<div>${tarih(g.tarih)} · ${hacim(g.hacim_ml)} ${g.indirim_yuzde ? `<span class="rozet">−${Math.round(g.indirim_yuzde)}%</span>` : ""}</div>
    <div class="f">${para(g.fiyat_eur, "EUR")}</div>${ek.length ? `<div class="a">${ek.join(" · ")}</div>` : ""}</div>`;
}
// Ülkedeki yerel piyasa: web'den doğrulanmış perakende referansları + o ülkedeki şehir mağazası gözlemleri
function yerelPazar(k, ulke, haricYerler) {
  const ref = V.piyasa.filter(p => pAnahtar(p) === k && p.tur === "yerel" && (p.ulke === ulke || (p.ulke === "EU" && AB.has(ulke))));
  const sehir = G.filter(g => anahtar(g) === k && YER[g.yer_kod].tur !== "duty-free" && YER[g.yer_kod].ulke === ulke && g.fiyat_eur != null && !haricYerler.includes(g.yer_kod)).sort(yeniden);
  const litre = ref.filter(p => p.eur_alt != null && p.hacim_ml).map(p => p.eur_alt / (p.hacim_ml / 1000)).concat(sehir.filter(g => g.eur_litre != null).map(g => g.eur_litre));
  return { ref, sehir, enDusuk: litre.length ? Math.min(...litre) : null };
}
function refSatiri(p) {
  const aralik = (a, b, pr) => para(a, pr) + (b != null ? "–" + para(b, pr) : "");
  const fiyat = (p.para !== "EUR" ? aralik(p.fiyat_alt, p.fiyat_ust, p.para) + " · " : "") + aralik(p.eur_alt, p.eur_ust, "EUR");
  const ad = esc(L === "tr" ? p.pazar : p.pazar_en) + " · " + tarih(p.tarih);
  return `<div class="ref"><span>${p.kaynak ? `<a href="${esc(p.kaynak)}" rel="noopener">${ad}</a>` : ad}</span><span>${fiyat}</span></div>`;
}
function pazarBlogu(k, ulke, df, haricYerler) {
  if (!ulke) return "";
  const y = yerelPazar(k, ulke, haricYerler);
  if (!y.ref.length && !y.sehir.length) return "";
  let hukum = "";
  if (df && df.eur_litre != null && y.enDusuk != null) {
    const f = (df.eur_litre - y.enDusuk) / y.enDusuk * 100;
    hukum = Math.abs(f) < 2 ? `<div class="hukum esit">${kod(df.yer_kod)} ${esc(t("lSame"))}</div>`
      : `<div class="hukum ${f < 0 ? "ucuz" : "pahali"}">${kod(df.yer_kod)} ${esc(t(f < 0 ? "lBelow" : "lAbove", { p: Math.abs(f).toFixed(0) }))}</div>`;
  }
  return `<div class="pazar"><div class="ad">${esc(t("localMarket", { c: ULKE[L][ulke] || ulke }))}</div>${y.ref.map(refSatiri).join("")}${y.sehir.map(g => satir(g)).join("")}${hukum}</div>`;
}
function gruplar(yerKod) {
  const m = new Map();
  if (yerKod) for (const g of G) if (g.yer_kod === yerKod) (m.get(anahtar(g)) || m.set(anahtar(g), []).get(anahtar(g))).push(g);
  for (const l of m.values()) l.sort(yeniden);
  return m;
}
// İki taraftaki en yeni fiyatlardan kıyaslanacak çifti seç: önce aynı şişe boyu, yoksa litre fiyatı
function cift(al, bl) {
  const a = al.filter(g => g.fiyat_eur != null), b = bl.filter(g => g.fiyat_eur != null);
  if (!a.length || !b.length) return null;
  for (const x of a) { const y = b.find(z => z.hacim_ml && z.hacim_ml === x.hacim_ml); if (y) return { x, y, fa: x.fiyat_eur, fb: y.fiyat_eur, olcu: "sise" }; }
  const x = a[0], y = b[0];
  return x.eur_litre != null && y.eur_litre != null ? { x, y, fa: x.eur_litre, fb: y.eur_litre, olcu: "litre" } : { x, y, fa: x.fiyat_eur, fb: y.fiyat_eur, olcu: "belirsiz" };
}
function rotaCiz() {
  const a = $("kalkis").value, b = $("varis").value;
  if (!a && !b) { $("rota").innerHTML = `<div class="bos">${esc(t("pickHint"))}</div>`; return; }
  if (a === b) { $("rota").innerHTML = `<div class="bos">${esc(t("same"))}</div>`; return; }
  const A = gruplar(a), B = gruplar(b), ua = a && YER[a].ulke, ub = b && YER[b].ulke, haric = [a, b].filter(Boolean);
  const ortak = [...A.keys()].filter(k => B.has(k)), yalnizA = [...A.keys()].filter(k => !B.has(k)), yalnizB = [...B.keys()].filter(k => !A.has(k));
  const ada = (m, k) => urunAdi(m.get(k)[0]), sirala = (m, l) => l.sort((p, q) => ada(m, p).localeCompare(ada(m, q), YEREL[L]));
  let h = "";
  if (ortak.length) {
    h += `<h3>${esc(t("gBoth", { n: ortak.length }))}</h3>` + sirala(A, ortak).map(k => {
      const al = A.get(k), bl = B.get(k), c = cift(al, bl);
      let hukum = "", uyari = "";
      if (c) {
        const fark = (c.fb - c.fa) / c.fa * 100, yil = Math.abs(new Date(c.x.tarih) - new Date(c.y.tarih)) / 864e5 / 365;
        hukum = Math.abs(fark) < 2 ? `<div class="hukum esit">${esc(t("vSame"))}</div>`
          : fark < 0 ? `<div class="hukum pahali">${esc(t("vTo", { p: Math.abs(fark).toFixed(0) }))}</div>`
          : `<div class="hukum ucuz">${esc(t("vFrom", { p: (fark / (100 + fark) * 100).toFixed(0) }))}</div>`;
        uyari = [t("latest"), c.olcu === "litre" ? t("wLitre") : "", c.olcu === "belirsiz" ? t("wSize") : "", yil >= 1 ? t("wYears", { y: yil.toLocaleString(YEREL[L], { maximumFractionDigits: 1 }) }) : ""].filter(Boolean).join(" · ");
      }
      const pazar = pazarBlogu(k, ua, al.find(g => g.eur_litre != null), haric) + (ub !== ua ? pazarBlogu(k, ub, bl.find(g => g.eur_litre != null), haric) : "");
      return `<div class="kart"><div class="urun">${esc(urunAdi(al[0]))}</div><div class="iki"><div class="yan">${al.map(g => satir(g, c && g === c.x)).join("")}</div><div class="yan">${bl.map(g => satir(g, c && g === c.y)).join("")}</div></div>
        ${hukum}${uyari ? `<div class="alt">${esc(uyari)}</div>` : ""}${pazar}</div>`;
    }).join("");
  }
  const tek = (m, l, yer, ulke) => l.length ? `<h3>${esc(t("gOnly", { x: yerAdi(YER[yer]), n: l.length }))}</h3>` + sirala(m, l).map(k => {
    const ol = m.get(k);
    return `<div class="kart"><div class="urun">${esc(urunAdi(ol[0]))}</div><div>${ol.map(g => satir(g)).join("")}</div>${pazarBlogu(k, ulke, ol.find(g => g.eur_litre != null), haric)}</div>`;
  }).join("") : "";
  h += tek(A, yalnizA, a, ua) + tek(B, yalnizB, b, ub);
  $("rota").innerHTML = h || `<div class="bos">${esc(t("nothing"))}</div>`;
}
function urunCiz() {
  const soz = $("ara").value.toLocaleLowerCase(YEREL[L]).split(/\s+/).filter(Boolean), kat = $("kat").value, m = new Map();
  for (const g of G) {
    if (kat && g.kategori !== kat) continue;
    const metin = (g.marka + " " + g.urun + " " + g.urun_en + " " + (KAT[L][g.kategori] || "") + " " + g.kategori).toLocaleLowerCase(YEREL[L]);
    if (!soz.every(s => metin.includes(s))) continue;
    (m.get(anahtar(g)) || m.set(anahtar(g), []).get(anahtar(g))).push(g);
  }
  const gr = [...m.entries()].sort((p, q) => urunAdi(p[1][0]).localeCompare(urunAdi(q[1][0]), YEREL[L]));
  $("urun-ozet").textContent = t("summary", { a: gr.length, b: gr.reduce((n, e) => n + e[1].length, 0) });
  $("urunliste").innerHTML = gr.map(([k, l]) => {
    l.sort((p, q) => p.yer_kod.localeCompare(q.yer_kod) || yeniden(p, q));
    const lt = l.filter(g => g.eur_litre != null), enUcuz = lt.length > 1 ? lt.reduce((x, g) => g.eur_litre < x.eur_litre ? g : x) : null;
    const ref = V.piyasa.filter(p => pAnahtar(p) === k);
    return `<div class="kart"><div class="urun">${esc(urunAdi(l[0]))} <small>${esc(KAT[L][l[0].kategori] || l[0].kategori)}</small></div><div>${l.map(g => satir(g, g === enUcuz)).join("")}</div>
      ${ref.length ? `<div class="pazar"><div class="ad">${esc(t("refs"))}</div>${ref.map(refSatiri).join("")}</div>` : ""}</div>`;
  }).join("") || `<div class="bos">${esc(t("noMatch"))}</div>`;
}
function durum(k, v) { sonDurum = k ? [k, v] : null; $("durum").textContent = k ? t(k, v) : ""; }
function yerBul(q) {
  const s = q.toLocaleLowerCase("en").split(/\s+/).filter(Boolean);
  const uyan = V.yerler.filter(y => G.some(g => g.yer_kod === y.kod)).filter(y => s.every(x => (y.kod + " " + y.ad + " " + y.ad_en + " " + (y.arama || "")).toLocaleLowerCase("en").includes(x)));
  return uyan.find(y => y.kod.toLowerCase() === q.toLowerCase()) || uyan.find(y => y.tur === "duty-free") || uyan[0] || null;
}
async function ucusAra(e) {
  e.preventDefault();
  const q = $("ucus").value.trim();
  if (!q) return;
  const ucus = q.toUpperCase().replace(/[\s-]+/g, "");
  if (/^([A-Z]{2,3}|[A-Z]\d|\d[A-Z])\d{1,4}[A-Z]?$/.test(ucus)) {
    durum("looking");
    try {
      const r = await fetch("https://api.adsbdb.com/v0/callsign/" + encodeURIComponent(ucus)), fr = (await r.json())?.response?.flightroute;
      if (!fr) return durum("flightNotFound", { code: ucus });
      const o = fr.origin.iata_code, h = fr.destination.iata_code, bilinen = k => YER[k] && G.some(g => g.yer_kod === k);
      $("kalkis").value = bilinen(o) ? o : ""; $("varis").value = bilinen(h) ? h : "";
      rotaCiz();
      const eksik = [[o, fr.origin], [h, fr.destination]].filter(([k]) => !bilinen(k)).map(([k, y]) => `${y.municipality || y.name} (${k})`);
      durum("flightFound", { code: ucus, a: o, b: h });
      if (eksik.length) $("durum").textContent += " " + eksik.map(x => t("noData", { x })).join(" ");
    } catch { durum("lookupFailed"); }
    return;
  }
  const y = yerBul(q);
  if (!y) return durum("noData", { x: q });
  $("varis").value = y.kod; rotaCiz(); durum("destSet", { x: `${yerAdi(y)} (${y.kod.replace("TYO-", "")})` });
}
function dilUygula(d) {
  L = T[d] ? d : "en";
  document.documentElement.lang = L;
  try { localStorage.setItem("dfm-dil", L); } catch {}
  for (const b of document.querySelectorAll("[data-dil]")) b.setAttribute("aria-pressed", String(b.dataset.dil === L));
  for (const e of document.querySelectorAll("[data-t]")) e.textContent = t(e.dataset.t);
  for (const e of document.querySelectorAll("[data-tp]")) e.placeholder = t(e.dataset.tp);
  for (const e of document.querySelectorAll("[data-ta]")) e.setAttribute("aria-label", t(e.dataset.ta));
  const tarihler = G.map(g => g.tarih).sort(), yerler = V.yerler.filter(y => G.some(g => g.yer_kod === y.kod));
  $("sayilar").innerHTML = [t("sPrices", { n: `<b>${G.length}</b>` }), t("sAirports", { n: `<b>${yerler.filter(y => y.tur === "duty-free").length}</b>` }),
    `<b>${tarih(tarihler[0])}</b> – <b>${tarih(tarihler.at(-1))}</b>`, t("sUpdated", { d: `<b>${tarih(V.uretim)}</b>` })].map(s => `<span>${s}</span>`).join("");
  const secenek = y => `<option value="${y.kod}">${esc(y.kod.replace("TYO-", ""))} — ${esc(yerAdi(y))}</option>`;
  for (const id of ["kalkis", "varis"]) { const v = $(id).value; $(id).innerHTML = `<option value="">${esc(t("none"))}</option>` + yerler.map(secenek).join(""); $(id).value = v; }
  const k = $("kat").value;
  $("kat").innerHTML = `<option value="">${esc(t("all"))}</option>` + [...new Set(G.map(g => g.kategori))].map(c => [c, KAT[L][c] || c]).sort((p, q) => p[1].localeCompare(q[1], YEREL[L])).map(([c, ad]) => `<option value="${esc(c)}">${esc(ad)}</option>`).join("");
  $("kat").value = k;
  $("urunler").innerHTML = [...new Set(G.map(urunAdi))].sort((p, q) => p.localeCompare(q, YEREL[L])).map(u => `<option value="${esc(u)}">`).join("");
  if (sonDurum) $("durum").textContent = t(...sonDurum);
  rotaCiz(); urunCiz();
}
function kur() {
  let d = "en";
  try { d = localStorage.getItem("dfm-dil") || "en"; } catch {}
  dilUygula(d);
  // Açılışta en çok ortak ürünü olan havalimanı çifti
  const df = V.yerler.filter(y => y.tur === "duty-free" && G.some(g => g.yer_kod === y.kod));
  let en = ["", "", -1];
  for (const a of df) for (const b of df) if (a.kod < b.kod) { const B = gruplar(b.kod), n = [...gruplar(a.kod).keys()].filter(k => B.has(k)).length; if (n > en[2]) en = [a.kod, b.kod, n]; }
  $("kalkis").value = en[0]; $("varis").value = en[1];
  for (const b of document.querySelectorAll("[data-dil]")) b.addEventListener("click", () => dilUygula(b.dataset.dil));
  for (const id of ["kalkis", "varis"]) $(id).addEventListener("change", () => { durum(null); rotaCiz(); });
  $("cevir").addEventListener("click", () => { const k = $("kalkis").value; $("kalkis").value = $("varis").value; $("varis").value = k; rotaCiz(); });
  $("ucus-form").addEventListener("submit", ucusAra);
  for (const id of ["ara", "kat"]) $(id).addEventListener("input", urunCiz);
  rotaCiz();
}
kur();
</script>
