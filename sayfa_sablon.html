<title>Duty Free Map</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Yerleşim: tek sütun, telefon öncelikli. Üstte rota (uçuş kodu ya da iki havalimanı), altında ürün bazlı fiyat listesi.

:root {

  --baslik: "Barlow Condensed", "Arial Narrow", "Helvetica Neue", sans-serif;
  --govde: "IBM Plex Sans", -apple-system, "Segoe UI", sans-serif;
  --rakam: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --zemin: #0f1317; --kagit: #171c22; --murekkep: #e9ecef; --soluk: #97a1ac; --cizgi: #2a323b;
  --tabela: #f5c400; --tabela-yazi: #14191f; --ucuz: #4cc38a; --pahali: #f0816d; --ucuz-zemin: #12301f; --pahali-zemin: #3a1a14; color-scheme: dark } }
:root[data-theme="dark"] {
  --zemin: #0f1317; --kagit: #171c22; --murekkep: #e9ecef; --soluk: #97a1ac; --cizgi: #2a323b;
  --tabela: #f5c400; --tabela-yazi: #14191f; --ucuz: #4cc38a; --pahali: #f0816d; --ucuz-zemin: #12301f; --pahali-zemin: #3a1a14; color-scheme: dark }

body { background: var(--zemin); color: var(--murekkep); font: 15px/1.45 var(--govde); padding-inline: 16px; padding-block: 20px 48px; }
.sayfa { max-width: 760px; margin-inline: auto; display: grid; gap: 28px; }
h1 { font: 700 34px/1 var(--baslik); letter-spacing: .01em; margin: 0; }
h2 { font: 700 22px/1.1 var(--baslik); letter-spacing: .02em; text-transform: uppercase; margin: 0; text-wrap: balance; }
h3 { font: 600 13px/1.2 var(--govde); letter-spacing: .06em; text-transform: uppercase; color: var(--soluk); margin: 6px 0 0; }
.ust { display: grid; gap: 8px; }
.ust-satir { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
.ust p { margin: 0; color: var(--soluk); max-width: 62ch; }
.sayilar { display: flex; flex-wrap: wrap; gap: 6px 18px; font: 500 13px var(--rakam); color: var(--soluk); }
.sayilar b { color: var(--murekkep); font-weight: 500; }
.diller { display: flex; gap: 4px; }
.diller button { font: 600 12px var(--govde); letter-spacing: .04em; background: transparent; color: var(--soluk); border: 1px solid var(--cizgi); border-radius: 4px; padding: 5px 8px; cursor: pointer; }
.diller button[aria-pressed="true"] { background: var(--murekkep); color: var(--zemin); border-color: var(--murekkep); }

.kod { display: inline-block; background: var(--tabela); color: var(--tabela-yazi); font: 700 15px/1 var(--baslik); letter-spacing: .04em;
  padding: 4px 6px 3px; border-radius: 3px; white-space: nowrap; }
.kod.sehir { background: transparent; color: var(--murekkep); box-shadow: inset 0 0 0 1.5px var(--murekkep); }

.bolum { display: grid; gap: 14px; }
.denetim { display: flex; flex-wrap: wrap; gap: 10px; align-items: end; }
.denetim label { display: grid; gap: 4px; font-size: 12px; color: var(--soluk); flex: 1 1 150px; min-width: 0; }
select, input[type="search"], input[type="text"] { font: 15px var(--govde); color: var(--murekkep); background: var(--kagit); border: 1px solid var(--cizgi);
  border-radius: 6px; padding: 9px 10px; width: 100%; min-width: 0; box-sizing: border-box; }
button.dugme { font: 600 15px/1 var(--govde); background: var(--murekkep); color: var(--zemin); border: 1px solid var(--murekkep); border-radius: 6px; padding: 11px 16px; cursor: pointer; }
button.cevir { font: 600 18px/1 var(--govde); background: var(--kagit); color: var(--murekkep); border: 1px solid var(--cizgi); border-radius: 6px; padding: 9px 13px; cursor: pointer; }
select:focus-visible, input:focus-visible, button:focus-visible, summary:focus-visible, a:focus-visible { outline: 2px solid var(--tabela); outline-offset: 2px; }
.durum { font-size: 13px; color: var(--soluk); min-height: 1.3em; }

.liste { display: grid; gap: 10px; }
.kart { background: var(--kagit); border: 1px solid var(--cizgi); border-radius: 8px; padding: 12px 14px; display: grid; gap: 10px; min-width: 0; }
.urun { font-weight: 600; overflow-wrap: anywhere; }
.urun small { font-weight: 400; color: var(--soluk); }
.iki { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 480px) { .iki { grid-template-columns: 1fr; } }
.yan { display: grid; gap: 6px; align-content: start; min-width: 0; }
.alt { font-size: 12px; color: var(--soluk); overflow-wrap: anywhere; }
.hukum { font-size: 13px; font-weight: 600; padding: 6px 9px; border-radius: 5px; }
.hukum.ucuz { background: var(--ucuz-zemin); color: var(--ucuz); }
.hukum.pahali { background: var(--pahali-zemin); color: var(--pahali); }
.hukum.esit { background: var(--zemin); color: var(--soluk); }
.bos { color: var(--soluk); padding: 14px; border: 1px dashed var(--cizgi); border-radius: 8px; }

.satir { display: grid; grid-template-columns: auto 1fr auto; gap: 4px 10px; align-items: baseline; padding-top: 8px; border-top: 1px solid var(--cizgi); }
.satir:first-child { border-top: 0; padding-top: 0; }
.satir .f { font: 500 15px var(--rakam); font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
.satir .a { grid-column: 2 / -1; font-size: 12px; color: var(--soluk); overflow-wrap: anywhere; }
.rozet { font: 500 11px var(--rakam); padding: 1px 5px; border-radius: 3px; background: var(--ucuz-zemin); color: var(--ucuz); white-space: nowrap; }
.kismi { color: var(--pahali); }
.enucuz .f { color: var(--ucuz); }
.pazar { display: grid; gap: 4px; border-top: 1px dashed var(--cizgi); padding-top: 8px; font-size: 13px; }
.pazar .ad { font-size: 12px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--soluk); }
.pazar .ref { display: flex; flex-wrap: wrap; gap: 2px 10px; justify-content: space-between; }
.pazar .ref span:last-child { font-family: var(--rakam); font-variant-numeric: tabular-nums; }
a { color: inherit; }
.katki { display: grid; gap: 8px; border-left: 4px solid var(--tabela); padding-left: 14px; }
.katki p { margin: 0; max-width: 62ch; }
.yukle { display: grid; gap: 10px; max-width: 520px; }
.yukle label { display: grid; gap: 4px; font-size: 12px; color: var(--soluk); min-width: 0; }
.yukle input[type="file"], .yukle input[type="date"] { font: 14px var(--govde); color: var(--murekkep); background: var(--kagit); border: 1px solid var(--cizgi); border-radius: 6px; padding: 8px 10px; width: 100%; min-width: 0; box-sizing: border-box; }
.yukle button[disabled] { opacity: .55; cursor: default; }
.gizli { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }
.dip { font-size: 12px; color: var(--soluk); max-width: 70ch; margin: 0; }
</style>

<div class="sayfa">
  <header class="ust">
    <div class="ust-satir">
      <h1>Duty Free Map</h1>
      <div class="diller" role="group" aria-label="Language">
        <button type="button" data-dil="en">EN</button><button type="button" data-dil="de">DE</button><button type="button" data-dil="es">ES</button><button type="button" data-dil="tr">TR</button>
      </div>
    </div>
    <p data-t="tagline"></p>
    <div class="sayilar" id="sayilar"></div>
  </header>

  <section class="bolum" aria-labelledby="b-rota">
    <h2 id="b-rota" data-t="hRoute"></h2>
    <form class="denetim" id="ucus-form">
      <label for="ucus"><span data-t="flightLabel"></span><input id="ucus" type="text" autocomplete="off" autocapitalize="characters" spellcheck="false" data-tp="flightPh"></label>
      <button class="dugme" type="submit" data-t="find"></button>
    </form>
    <div class="durum" id="durum" role="status"></div>
    <div class="denetim">
      <label for="kalkis"><span data-t="from"></span><select id="kalkis"></select></label>
      <button class="cevir" id="cevir" type="button" data-ta="swap">⇄</button>
      <label for="varis"><span data-t="to"></span><select id="varis"></select></label>
    </div>
    <div class="liste" id="rota"></div>
  </section>

  <section class="bolum" aria-labelledby="b-urun">
    <h2 id="b-urun" data-t="hProducts"></h2>
    <div class="denetim">
      <label for="ara" style="flex-basis:100%"><span data-t="searchLabel"></span><input id="ara" type="search" list="urunler" autocomplete="off" data-tp="searchPh"></label>
      <datalist id="urunler"></datalist>
      <label for="kat"><span data-t="type"></span><select id="kat"></select></label>
    </div>
    <div class="alt" id="urun-ozet"></div>
    <div class="liste" id="urunliste"></div>
  </section>

  <section class="katki" aria-labelledby="b-katki">
    <h2 id="b-katki" data-t="hAdd"></h2>
    <p data-t="add1"></p>
    <p data-t="upIntro"></p>
    <form class="yukle" id="yukle-form">
      <label for="y-foto"><span data-t="upPhoto"></span><input id="y-foto" type="file" accept="image/*" multiple></label>
      <div class="denetim">
        <label for="y-yer"><span data-t="upPlace"></span><input id="y-yer" type="text" maxlength="60" autocomplete="off" data-tp="upPlacePh"></label>
        <label for="y-tarih"><span data-t="upDate"></span><input id="y-tarih" type="date"></label>
      </div>
      <label for="y-not"><span data-t="upNote"></span><input id="y-not" type="text" maxlength="300" autocomplete="off"></label>
      <div class="gizli" aria-hidden="true"><label for="y-web">Website<input id="y-web" type="text" tabindex="-1" autocomplete="off"></label></div>
      <div><button class="dugme" type="submit" id="y-gonder" data-t="upSend"></button></div>
      <div class="durum" id="y-durum" role="status"></div>
      <p class="alt" data-t="upPrivacy"></p>
    </form>
    <p class="alt"><span data-t="add2a"></span><a href="https://github.com/niedy707/Duty-Free-Map" rel="noopener">GitHub</a><span data-t="add2b"></span></p>
  </section>

  <p class="dip" data-t="foot"></p>
</div>

      const r = await fetch("/api/yukle?" + q, { method: "POST", headers: { "Content-Type": "image/jpeg" }, body: govde });
      if (r.ok) { tamam++; continue; }
      const h = (await r.json().catch(() => ({}))).hata;
      neden = { full: "eFull", size: "eSize", type: "eType", fields: "eFields" }[h] || "eNet";
      if (h === "full" || h === "fields") break;
    } catch { neden = "eType"; }
  }
  $("y-gonder").disabled = false;
  if (tamam === dosyalar.length) { yaz("upDone", { n: tamam }); $("y-foto").value = ""; $("y-not").value = ""; }
  else if (tamam) yaz("upSome", { n: tamam, t: dosyalar.length, why: t(neden) });
  else yaz("upFail", { why: t(neden) });
}
function dilUygula(d) {

  const tarihler = G.map(g => g.tarih).sort(), yerler = V.yerler.filter(y => y.tur === "duty-free" && G.some(g => g.yer_kod === y.kod));

    `<b>${tarih(tarihler[0])}</b> – <b>${tarih(tarihler.at(-1))}</b>`, t("sUpdated", { d: `<b>${tarih(V.uretim)}</b>` })].map(s => `<span>${s}</span>`).join("");
  const secenek = y => `<option value="${y.kod}">${esc(y.kod.replace("TYO-", ""))} — ${esc(yerAdi(y))}</option>`;
  for (const id of ["kalkis", "varis"]) { const v = $(id).value; $(id).innerHTML = `<option value="">${esc(t("none"))}</option>` + yerler.map(secenek).join(""); $(id).value = v; }
  const k = $("kat").value;
  $("kat").innerHTML = `<option value="">${esc(t("all"))}</option>` + [...new Set(G.map(g => g.kategori))].map(c => [c, KAT[L][c] || c]).sort((p, q) => p[1].localeCompare(q[1], YEREL[L])).map(([c, ad]) => `<option value="${esc(c)}">${esc(ad)}</option>`).join("");
  $("kat").value = k;
  $("urunler").innerHTML = [...new Set(G.map(urunAdi))].sort((p, q) => p.localeCompare(q, YEREL[L])).map(u => `<option value="${esc(u)}">`).join("");
  if (sonDurum) $("durum").textContent = t(...sonDurum);
  rotaCiz(); urunCiz();
}
